[build]
  publish = "."

# Convenience paths for print, verbal referrals, and typed URLs. All funnel to
# Naples Estate Jewelry (the parent business). None of these exist as files.
[[redirects]]
  from = "/shop"
  to = "https://naplesestatejewelry.com/shop"
  status = 301

[[redirects]]
  from = "/showroom"
  to = "https://naplesestatejewelry.com/contact"
  status = 301

[[redirects]]
  from = "/directions"
  to = "https://maps.google.com/?cid=17050430560749692864"
  status = 302

[[redirects]]
  from = "/es"
  to = "https://naplesestatejewelry.com/es/sell/naples"
  status = 301

# Internal files that live in the publish root but should not be public.
# force = true is required because the files exist on disk.
[[redirects]]
  from = "/SEO-PLAN.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/logo-animated.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/og-image-generator.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README-DEPLOY.md"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
    [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://res.cloudinary.com; connect-src 'self' https://res.cloudinary.com; upgrade-insecure-requests"
